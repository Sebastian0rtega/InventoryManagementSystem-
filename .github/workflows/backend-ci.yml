name: backend-ci

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: inventory_test_db
          POSTGRES_USER: inventory_ci_user
          POSTGRES_PASSWORD: inventory_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_ci_user -d inventory_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    env:
      NODE_ENV: ${{vars.NODE_ENV}}
      PORT: ${{vars.PORT}}
      DB_HOST: ${{vars.DB_HOST}}
      DB_PORT: ${{vars.DB_HOST}}
      DB_NAME: ${{vars.DB_NAME}}
      DB_NAME_TEST: ${{vars.DB_NAME_TEST}}
      DB_USER: ${{ vars.DB_USER }}
      DB_PASSWORD: ${{vars.DB_PASSWORD}}
      JWT_SECRET: ${{vars.JWT_SECRET}}
      ADMIN_PASSWORD: ${{vars.ADMIN_PASSWORD}}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Lint backend
        run: npm run lint

      - name: Set up test database
        run: npm run db:test:setup

      - name: Run backend tests
        run: npm test -- --json --outputFile=jest-results.json

      - name: Enforce minimum test coverage count
        run: >-
          node -e "const result = require('./jest-results.json');
          const suites = result.numPassedTestSuites;
          const tests = result.numPassedTests;
          console.log('Passed suites: ' + suites + '; passed tests: ' + tests);
          if (suites < 7 || tests < 82) {
            console.error('CI requires at least 7 passing suites and 82 passing tests.');
            process.exit(1);
          }"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: ghcr.io/sebastian0rtega/inventorymanagementsystem:${{ github.sha }}

      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: build
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: ghcr.io/sebastian0rtega/inventorymanagementsystem:${{ github.sha }}-migrate
